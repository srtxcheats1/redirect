<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to SRT X CHEATS</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }

  :root {
    --gold: #d6b06a;
    --gold-light: #f1dba5;
    --gold-dark: #8c6b2f;
    --red: #b3112b;
    --ink: #0d0b0b;
    --panel: #181414;
    --muted: #a39a8c;
  }

  body {
    background:
      radial-gradient(ellipse at 50% 0%, #3a0f16 0%, rgba(58,15,22,0) 60%),
      radial-gradient(ellipse at 50% 100%, #2a1a0a 0%, rgba(42,26,10,0) 55%),
      #0d0b0b;
    background-attachment: fixed;
    color: #efe8da;
    font-family: "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  body.locked { overflow: hidden; height: 100%; }

  /* =====================================================
     STEP 1 : WELCOME INTRO (curtains)
  ===================================================== */
  #intro {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
  }
  #intro.done { pointer-events: none; }

  .curtain {
    position: absolute;
    top: 0; bottom: 0;
    width: 50.2%;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.35) 0 3px, rgba(255,255,255,.02) 3px 6px),
      linear-gradient(180deg, #5a0c1c, #2c0710);
    transition: transform 1.5s cubic-bezier(.7,0,.2,1);
  }
  .curtain.l { left: 0;  border-right: 2px solid var(--gold-dark); }
  .curtain.r { right: 0; border-left: 2px solid var(--gold-dark); }
  #intro.open .curtain.l { transform: translateX(-102%); }
  #intro.open .curtain.r { transform: translateX(102%); }

  .stage {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 20px;
    transition: opacity 0.7s ease;
  }
  #intro.open .stage { opacity: 0; }

  .corner {
    position: absolute;
    width: 44px; height: 44px;
    border: 2px solid var(--gold);
    opacity: 0;
    animation: fade 1s ease 0.2s forwards;
  }
  .corner.tl { top: 22px; left: 22px;  border-right: 0; border-bottom: 0; }
  .corner.tr { top: 22px; right: 22px; border-left: 0;  border-bottom: 0; }
  .corner.bl { bottom: 22px; left: 22px;  border-right: 0; border-top: 0; }
  .corner.br { bottom: 22px; right: 22px; border-left: 0;  border-top: 0; }

  .welcome {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(38px, 12vw, 96px);
    letter-spacing: 0.18em;
    padding-left: 0.18em;
    margin: 0;
    color: var(--gold-light);
    text-shadow: 0 3px 0 #000, 0 0 30px rgba(0,0,0,.6);
  }
  .welcome span {
    display: inline-block;
    opacity: 0;
    transform: translateY(26px) scale(.9);
    animation: letter 0.7s cubic-bezier(.2,.8,.3,1) forwards;
  }

  .orn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 16px 0 14px;
    color: var(--gold);
    opacity: 0;
    animation: fade 0.8s ease 1.4s forwards;
  }
  .orn i {
    display: block;
    height: 1px;
    width: 0;
    background: linear-gradient(90deg, transparent, var(--gold));
    animation: line 1s ease 1.5s forwards;
  }
  .orn i:last-child { background: linear-gradient(270deg, transparent, var(--gold)); }
  .orn b { font-size: 12px; }

  .to {
    font-size: clamp(12px, 3.2vw, 16px);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: #c9c0b0;
    opacity: 0;
    animation: fade 0.8s ease 2.0s forwards;
  }

  .brand {
    margin-top: 10px;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(28px, 8vw, 54px);
    letter-spacing: 0.12em;
    opacity: 0;
    transform: scale(.94);
    animation: pop 0.9s ease 2.5s forwards;
    background: linear-gradient(100deg, var(--gold-dark) 0%, var(--gold-light) 40%, var(--gold-dark) 60%, var(--gold-light) 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: pop 0.9s ease 2.5s forwards, shine 2.6s linear 2.6s infinite;
  }

  .loader {
    margin: 30px auto 0;
    width: 190px;
    height: 3px;
    background: rgba(255,255,255,.12);
    overflow: hidden;
    opacity: 0;
    animation: fade 0.5s ease 3.2s forwards;
  }
  .loader i {
    display: block; height: 100%; width: 0;
    background: var(--gold);
    animation: load 1.7s ease-in-out 3.3s forwards;
  }

  .skip {
    position: absolute;
    z-index: 3;
    bottom: 46px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.35);
    border: 1px solid var(--gold-dark);
    color: var(--gold-light);
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.25em;
    padding: 9px 22px;
    cursor: pointer;
    transition: all .2s;
  }
  .skip:hover { background: var(--gold); color: #1a1208; }
  #intro.open .skip { opacity: 0; }

  @keyframes letter { to { opacity: 1; transform: none; } }
  @keyframes fade   { to { opacity: 1; } }
  @keyframes line   { to { width: min(110px, 22vw); } }
  @keyframes pop    { to { opacity: 1; transform: none; } }
  @keyframes shine  { to { background-position: -250% 0; } }
  @keyframes load   { to { width: 100%; } }

  /* =====================================================
     STEP 2 : MAIN PAGE
  ===================================================== */
  #page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 34px 16px;
    visibility: hidden;
  }
  #page.on { visibility: visible; }

  .reveal { opacity: 0; transform: translateY(20px); }
  #page.on .reveal {
    animation: up 0.8s cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay: calc(var(--i) * 0.17s);
  }
  @keyframes up { to { opacity: 1; transform: none; } }

  .card {
    position: relative;
    width: 100%;
    max-width: 580px;
    padding: 38px 30px 26px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 40%),
      var(--panel);
    border: 1px solid var(--gold-dark);
    box-shadow: 0 25px 60px rgba(0,0,0,.65), inset 0 0 0 6px var(--panel), inset 0 0 0 7px rgba(214,176,106,.35);
  }

  /* gold corner ornaments */
  .card::before, .card::after {
    content: "";
    position: absolute;
    width: 26px; height: 26px;
    border: 3px solid var(--gold);
  }
  .card::before { top: -4px; left: -4px;  border-right: 0; border-bottom: 0; }
  .card::after  { bottom: -4px; right: -4px; border-left: 0; border-top: 0; }

  header { text-align: center; margin-bottom: 26px; }

  .crest {
    width: 74px; height: 74px;
    margin: 0 auto 14px;
    display: block;
  }

  .small {
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--muted);
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: normal;
    font-size: clamp(26px, 7vw, 38px);
    line-height: 1.2;
    margin: 8px 0 14px;
    color: #fff;
  }
  h1 b {
    font-weight: normal;
    background: linear-gradient(100deg, var(--gold-dark) 0%, var(--gold-light) 40%, var(--gold-dark) 60%, var(--gold-light) 100%);
    background-size: 250% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 5s linear infinite;
  }

  .divider {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    color: var(--gold);
    font-size: 10px;
  }
  .divider i {
    display: block; height: 1px; width: 70px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .divider i:last-child { background: linear-gradient(270deg, transparent, var(--gold)); }

  /* link rows */
  .item {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
    padding: 15px 18px;
    background: linear-gradient(90deg, #211b1b, #1a1616);
    border: 1px solid #3a322f;
    color: inherit;
    text-decoration: none;
    transition: transform .25s, border-color .25s, box-shadow .25s;
  }
  .item::before {
    content: "";
    position: absolute;
    top: 0; bottom: 0; left: -80%;
    width: 50%;
    background: linear-gradient(100deg, transparent, rgba(241,219,165,.16), transparent);
    transform: skewX(-20deg);
    transition: left .7s ease;
  }
  .item:hover, .item:focus-visible {
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow: 0 10px 24px rgba(0,0,0,.5);
    outline: none;
  }
  .item:hover::before, .item:focus-visible::before { left: 130%; }

  .ico {
    flex: none;
    width: 50px; height: 50px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #5b1522, #2d0911);
    border: 1px solid var(--gold-dark);
    color: var(--gold-light);
    transition: transform .3s, background .3s, color .3s;
  }
  .ico svg { width: 24px; height: 24px; fill: currentColor; }
  .item:hover .ico { transform: rotate(-8deg) scale(1.08); background: var(--gold); color: #24160a; }

  .txt { flex: 1; min-width: 0; }
  .txt strong {
    display: block;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    letter-spacing: .02em;
  }
  .txt small {
    display: block;
    font-size: 13px;
    color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .arrow {
    flex: none;
    font-size: 26px;
    color: var(--gold-dark);
    transition: transform .25s, color .25s;
  }
  .item:hover .arrow { transform: translateX(5px); color: var(--gold-light); }

  footer {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #332b28;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #857d70;
  }

  @media (max-width: 480px) {
    .card { padding: 30px 16px 22px; }
    .item { padding: 13px 14px; gap: 12px; }
    .ico { width: 44px; height: 44px; }
    .corner { width: 28px; height: 28px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: .01s !important; animation-delay: 0s !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body class="locked">

<script>
  // WELCOME letters, one by one
  var word = "WELCOME";
  var box = document.getElementById("welcomeText");
  for (var i = 0; i < word.length; i++) {
    var s = document.createElement("span");
    s.textContent = word.charAt(i);
    s.style.animationDelay = (0.3 + i * 0.12) + "s";
    box.appendChild(s);
  }

  var intro = document.getElementById("intro");
  var page = document.getElementById("page");
  var done = false;

  function openPage() {
    if (done) return;
    done = true;
    intro.classList.add("open");               // curtains slide apart
    setTimeout(function () {
      page.classList.add("on");                // content appears as curtains open
      document.body.classList.remove("locked");
    }, 500);
    setTimeout(function () { intro.classList.add("done"); intro.style.display = "none"; }, 1700);
  }

  document.getElementById("skipBtn").addEventListener("click", openPage);
  setTimeout(openPage, 5300);

  document.getElementById("year").textContent = new Date().getFullYear();
</script>

</html>
